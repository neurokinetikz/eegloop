# The alpha protocol over the site's shipped FOUR-channel asset: 60 s of ds-eegbci S001 R02 (eyes
# closed) on O1/O2/T7/T8 at 160 Hz, demeaned, ODC-By 1.0 — the occipitotemporal-4 replica the
# latency widget's feedback mode replays and lesson L7.16's rubric runs. The feedback value is the
# RMS of the 8–12 Hz band over the occipital pair, with the temporal pair present for the gate.
name: alpha-up-oc4-replay
seed: 20260920
block_samples: 32
processing_ms: 10.0
buffer_convention: block-period

source:
  kind: replay
  path: ../assets/oc4-ec.bin        # relative to this file; a mirror of the site's shipped asset (assets/README.md)
  pace: fast
  loop: false

signal:
  band: [8.0, 12.0]
  channels: [O1, O2]
  reference: none
  n_taps: 129
  derivation: rms
  smooth_s: 0.0

quality:
  enabled: true
  window_s: 1.0
  hold_s: 0.5
  mains_hz: 60
  policy: freeze

baseline:
  mode: fixed
  centre: median
  spread: mad

reward:
  mode: continuous
  lo_z: -1.0
  hi_z: 2.0

sham:
  mode: veridical

phases:
  - { kind: calibrate, duration_s: 15 }
  - { kind: train,     duration_s: 45 }

output:
  dir: sessions
  record_raw: false

versions:
  on_mismatch: warn
  pins: {}
